[workspace]
resolver = "2"
members = [
    "apps/commits/host",
    "crates/git",
    "crates/os",
    "crates/watcher",
    "ipc/rust",
]
exclude = [
    "vendor/bones",
    "vendor/bones/shared/bones-messages",
]

# Wasmtime + WebView2 exhaust the Windows ARM64 linker PDB limit with full
# dependency debug information. Keep local builds debuggable at line level
# through Rust sources while avoiding multi-gigabyte PDBs.
[profile.dev]
debug = 0

[profile.test]
debug = 0

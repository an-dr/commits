<!doctype html>
<meta charset="utf-8">
<title>commits</title>
<style>
  /* The chosen theme lives in settings, which only the component can read,
     and the component is precisely what has not loaded yet. Follow the OS
     instead, using the same colours as the default light and dark presets so
     the hand-over to the real page is not a jarring change of palette. */
  :root {
    color-scheme: light dark;
    --canvas: #f3f3f3;
    --text: #24292f;
    --muted: #6a737d;
    --track: rgba(0, 0, 0, .12);
    --accent: #007fd4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #1e1e1e;
      --text: #d4d4d4;
      --muted: #8b949e;
      --track: rgba(255, 255, 255, .14);
      --accent: #007fd4;
    }
  }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--canvas);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .title { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .detail { font-size: 12px; color: var(--muted); }

  .track {
    width: 210px;
    height: 3px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }

  /* Indeterminate: the load has no progress to report, and pretending
     otherwise would be a lie the bar cannot keep. */
  .bar {
    width: 40%;
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    animation: slide 1.15s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-105%); }
    100% { transform: translateX(355%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar { animation: none; width: 100%; opacity: .55; }
  }
</style>
<div class="title">commits</div>
<div class="track"><div class="bar"></div></div>
<div class="detail">Starting up&hellip;</div>

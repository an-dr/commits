[package]
name = "commits-app"
# The standalone app's own version: compared against a hosted manifest by
# the self-updater (bones_upgrader::is_newer) and shown in the About menu.
# Bump on every integration into main -- see AGENTS.md.
version = "1.5.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "commits-app"
path = "src/main.rs"

[[bin]]
name = "commits-askpass"
path = "src/bin/commits-askpass.rs"

[[bin]]
name = "commits-editor"
path = "src/bin/commits-editor.rs"

# The permanent entry point, placed at the install root as `commits.exe` by
# dist.ps1 and by an install. The mechanism is `bones-upgrader`'s; the name
# is ours, which is why the binary is declared here -- users see it.
[[bin]]
name = "commits-launcher"
path = "src/bin/commits-launcher.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1.0"
# The engine facade is the whole public surface an embedder gets: bus,
# logging, and the builder all come through it (bones ADR-030). Default
# features off because this app draws its interface in a web panel -- it
# needs `web` (which pulls in the window and the presentation stack) but
# never the audio or game-core native modules.
bones-engine = { path = "../../../vendor/bones/crates/bones-engine", default-features = false, features = ["web", "os"] }
bones-messages = { path = "../../../vendor/bones/crates/bones-messages" }
commits-git = { path = "../../../crates/git" }
commits-ipc = { path = "../../../ipc/rust" }
bones-module-os = { path = "../../../vendor/bones/crates/bones-engine/bones-module-os" }
commits-os = { path = "../../../crates/os" }
bones-upgrader = { path = "../../../vendor/bones/crates/bones-upgrader" }
commits-watcher = { path = "../../../crates/watcher" }
dirs = "6.0.0"
rfd = "0.15"
tempfile = "3.27.0"

[dev-dependencies]
base64 = "0.22"
# Loading a component by hand, and the persistence service, are below the
# facade: `bones-engine` exposes composition, not the extension host it
# composes. Only the tests and `measure_component` need that, so the reach
# past the public surface stays out of what ships.
bones-kernel = { path = "../../../vendor/bones/crates/bones-engine/bones-kernel" }
# Only for `measure_precompile`, which times compiling the component against
# loading an already-compiled one.
wasmtime = { version = "47", features = ["component-model"] }


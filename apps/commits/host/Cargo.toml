[package]
name = "commits-app"
# The standalone app's own version: compared against a hosted manifest by
# the self-updater (commits_upgrader::is_newer) and shown in the About menu.
# Bump on every integration into main -- see AGENTS.md.
version = "0.3.1"
edition = "2021"

[[bin]]
name = "commits-app"
path = "src/main.rs"

[[bin]]
name = "commits-askpass"
path = "src/bin/commits-askpass.rs"

[[bin]]
name = "commits-editor"
path = "src/bin/commits-editor.rs"

[[bin]]
name = "commits"
path = "src/bin/commits-launcher.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
bones-messages = { path = "../../../vendor/bones/shared/bones-messages" }
bus = { path = "../../../vendor/bones/core/bus" }
commits-git = { path = "../../../crates/git" }
commits-ipc = { path = "../../../ipc/rust" }
commits-os = { path = "../../../crates/os" }
commits-upgrader = { path = "../../../crates/upgrader" }
commits-watcher = { path = "../../../crates/watcher" }
dirs = "6.0.0"
logging = { path = "../../../vendor/bones/core/logging" }
rfd = "0.15"
runner = { path = "../../../vendor/bones/core/runner", features = ["web"] }
tempfile = "3.27.0"
wasm-extensions = { path = "../../../vendor/bones/core/wasm-extensions" }

[dev-dependencies]
base64 = "0.22"
# Only for `measure_precompile`, which times compiling the component against
# loading an already-compiled one.
wasmtime = { version = "47", features = ["component-model"] }


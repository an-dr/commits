name: build

# Builds, tests and packages all three release platforms on every push. A
# v<version> tag also publishes them as a GitHub release, which is where the
# installed app looks for updates (docs/updating.md). Every platform is
# required: a release missing one would leave that platform's installs
# without updates, so a red platform must stop the release.
#
# Windows arm64 once died inside componentize-js shortly after spawning the
# locally bootstrapped wizer, while the same path worked on an arm64
# developer machine. The instrumentation in
# apps/commits/scripts/build-components.mjs and the cache steps below preserve
# enough evidence to diagnose another runner-only failure.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: linux-x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          # 22.12 exits silently inside componentize-js on Windows ARM64;
          # 22.23.2 completes the same wizer invocation on the same machine.
          node-version: "22.23.2"

      - uses: dtolnay/rust-toolchain@stable

      # wry's webkit2gtk backend and the vendored SDL3-from-source build both
      # need these; windows-latest and windows-11-arm ship MSVC/CMake/Ninja
      # already (see runner-images), so only Linux needs an explicit install.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxss-dev

      # Not `npm ci`: some optional native dependencies (e.g. @napi-rs/wasm-runtime's
      # peer deps) are platform-gated, so a lockfile resolved on one OS is not
      # guaranteed complete for another -- `npm ci`'s strict lockfile-completeness
      # check fails on Linux for exactly that reason. `npm install` resolves
      # what the current platform actually needs instead of requiring the
      # lockfile to already list every platform's variants.
      - run: npm install

      # win-arm64 has no prebuilt wizer, so `npm run build:wasm` builds one
      # with `cargo install` -- five minutes of wasmtime on that runner, on
      # every single run. The key carries the version the build script pins,
      # so bumping it there invalidates this without anyone remembering to.
      # Restore and save are separate so the save runs even when a later step
      # fails: the whole point is that a red arm64 run must not also mean
      # another five minutes of wasmtime on the next attempt.
      - name: Restore the bootstrapped wizer
        id: wizer-cache
        if: matrix.name == 'windows-arm64'
        uses: actions/cache/restore@v4
        with:
          path: .tools/wizer
          key: wizer-10.0.0-${{ matrix.name }}

      # Run as three steps rather than one build, so a failure names the
      # stage it happened in. This is not cosmetic: windows-arm64 has failed
      # here with exit code 1 and no output at all, and a step named "build
      # wasm components" is the difference between knowing that much and
      # knowing nothing. Each dist.ps1 part builds and then places its output
      # in dist/app, so nothing is built twice.
      - name: Build the page
        shell: pwsh
        run: ./scripts/dist.ps1 -Part web

      - name: Build the wasm components
        shell: pwsh
        run: ./scripts/dist.ps1 -Part wasm

      - name: Save the bootstrapped wizer
        if: always() && matrix.name == 'windows-arm64' && steps.wizer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/wizer
          key: wizer-10.0.0-${{ matrix.name }}

      - name: Build the host executables
        shell: pwsh
        run: ./scripts/dist.ps1 -Part host

      - run: npm run check

      - run: npm test

      - run: cargo test --workspace

      # Only a tag names the release; any other run packages against
      # v<version>, which checks the same files without publishing them.
      - name: Package the release
        shell: pwsh
        run: ./scripts/package-release.ps1 -Platform ${{ matrix.name }} -Repository ${{ github.repository }} -Tag "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      # The zip is also the runnable build: unzip it and run commits-app, or
      # its Install menu entry, to try this commit.
      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: commits-${{ matrix.name }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Three zips and three manifests. The manifests are what installed apps
      # read from releases/latest, so this must not be a pre-release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          test "$(ls release | wc -l)" -eq 6
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Commits ${{ github.ref_name }}" \
            --generate-notes

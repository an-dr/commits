name: build

# Every platform builds in one Docker image (ci/Dockerfile) through the same
# script a developer runs locally: scripts/ci-docker.sh <platform>. Windows is
# cross-compiled there, so the only job outside Docker is windows-tests, which
# runs the Rust tests on real Windows. A v<version> tag also publishes the
# builds as a GitHub release, where the installed app looks for updates.
# See docs/ci.md and docs/updating.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, windows-x64, windows-arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image, a Rust build and the Windows SDK together outgrow the
      # runner's free space; these preinstalled toolchains are never used.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The cargo registry and the downloaded Windows SDK are the same on
      # every run; ci-docker.sh mounts this directory into the container.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/commits-ci
          key: commits-ci-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: commits-ci-${{ matrix.platform }}-

      # Only a tag names the release; any other run packages against
      # v<version>, which checks the same files without publishing them.
      - name: Build in Docker
        run: ./scripts/ci-docker.sh ${{ matrix.platform }} "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      # The zip is also the runnable build: unzip it and run commits-app, or
      # its Install menu entry, to try this commit.
      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: commits-${{ matrix.platform }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      # windows-tests loads these; building them on Windows would repeat the
      # whole wasm toolchain outside Docker.
      - name: Upload the wasm components
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: components-${{ github.sha }}
          path: dist/extensions/*.wasm
          if-no-files-found: error
          retention-days: 1

  # A cross-compiled binary cannot run in a Linux container, so this is where
  # Windows-only code is actually executed (docs/ci.md).
  windows-tests:
    name: test (windows-x64, native)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: components-${{ github.sha }}
          path: dist/extensions

      - run: cargo test --workspace

  release:
    name: publish release
    needs: [build, windows-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: commits-*
          path: release
          merge-multiple: true

      # Three zips and three manifests. The manifests are what installed apps
      # read from releases/latest, so this must not be a pre-release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          test "$(ls release | wc -l)" -eq 6
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Commits ${{ github.ref_name }}" \
            --generate-notes

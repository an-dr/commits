name: build

# Windows x64 is the repo's only verified-working platform (see README) and
# is a required check. Linux is wired up but allowed to fail
# (continue-on-error) until someone confirms a green run and this comment can
# be updated to drop that.
#
# Windows arm64 is experimental and non-required. Earlier runs died inside
# componentize-js shortly after spawning the locally bootstrapped wizer, while
# the same path worked on an arm64 developer machine. The instrumentation in
# apps/commits/scripts/build-components.mjs and the cache steps below preserve
# enough evidence to diagnose another runner-only failure without blocking the
# verified Windows x64 build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            required: true
          - name: windows-arm64
            os: windows-11-arm
            required: false
          - name: linux-x64
            os: ubuntu-latest
            required: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - uses: dtolnay/rust-toolchain@stable

      # wry's webkit2gtk backend and the vendored SDL3-from-source build both
      # need these; windows-latest and windows-11-arm ship MSVC/CMake/Ninja
      # already (see runner-images), so only Linux needs an explicit install.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxss-dev

      # Not `npm ci`: some optional native dependencies (e.g. @napi-rs/wasm-runtime's
      # peer deps) are platform-gated, so a lockfile resolved on one OS is not
      # guaranteed complete for another -- `npm ci`'s strict lockfile-completeness
      # check fails on Linux for exactly that reason. `npm install` resolves
      # what the current platform actually needs instead of requiring the
      # lockfile to already list every platform's variants.
      - run: npm install

      # win-arm64 has no prebuilt wizer, so `npm run build:wasm` builds one
      # with `cargo install` -- five minutes of wasmtime on that runner, on
      # every single run. The key carries the version the build script pins,
      # so bumping it there invalidates this without anyone remembering to.
      # Restore and save are separate so the save runs even when a later step
      # fails: the whole point is that a red arm64 run must not also mean
      # another five minutes of wasmtime on the next attempt.
      - name: Restore the bootstrapped wizer
        id: wizer-cache
        if: matrix.name == 'windows-arm64'
        uses: actions/cache/restore@v4
        with:
          path: .tools/wizer
          key: wizer-10.0.0-${{ matrix.name }}

      # Run as three steps rather than one `npm run build`, so a failure names
      # the stage it happened in. This is not cosmetic: windows-arm64 has been
      # failing here with exit code 1 and no output at all, and a step named
      # "build wasm components" is the difference between knowing that much
      # and knowing nothing.
      - name: Build the page
        run: npm run build:web

      - name: Build the wasm components
        run: npm run build:wasm

      - name: Save the bootstrapped wizer
        if: always() && matrix.name == 'windows-arm64' && steps.wizer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/wizer
          key: wizer-10.0.0-${{ matrix.name }}

      - name: Build the host executables
        run: npm run build:host

      - run: npm run check

      - run: npm test

      - run: cargo test --workspace

      # Only windows-x64 has a defined install/launcher layout (docs/updating.md)
      # to assemble; the other legs stop at "compiles and tests pass" for now.
      - name: Assemble dist
        if: matrix.name == 'windows-x64'
        run: npm run dist

      # What `npm run dist` assembles is already the runnable layout -- unzip
      # and run commits.exe -- so this uploads it as-is rather than packaging
      # it again. Not a release: no tag, no signing, no version negotiation,
      # just the build this commit produced.
      #
      # The SHA is in the name because the download is a bare zip once saved,
      # with nothing inside it saying which commit it came from.
      - name: Upload the runnable build
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: commits-windows-x64-${{ github.sha }}
          path: dist/app
          if-no-files-found: error
          retention-days: 30

      # Linux has no install layout to assemble (dist.ps1 is Windows-only), so
      # this is the build's output rather than something to double-click: the
      # executables, the components they load, and the page they serve. Named
      # so nobody downloads it expecting the Windows experience.
      - name: Upload the linux build output
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: commits-linux-x64-build-output-${{ github.sha }}
          path: |
            target/release/commits-app
            target/release/commits
            target/release/commits-askpass
            target/release/commits-editor
            dist/extensions
            dist/ui
          if-no-files-found: error
          retention-days: 30

[env]
CMAKE_GENERATOR = "Ninja"

# Who the upgrader builds for. `bones-upgrader` spells none of these
# itself, so that bones or any other host can reuse the crate under its own
# names; this block is where this repository states them once, for every
# binary in the workspace at compile time.
#
# UPGRADER_LAUNCHER_VERSION must move with `[package] version` in
# apps/commits/host/Cargo.toml -- `commits --version` reports both, and the
# whole point of reporting them is spotting when they disagree. AGENTS.md's
# version-bump rule covers the pair.
UPGRADER_INSTALL_DIR_NAME = ".commits"
UPGRADER_INSTALL_ENV_VAR = "COMMITS_INSTALL_DIR"
UPGRADER_LAUNCHER_STEM = "commits"
UPGRADER_APP_STEM = "commits-app"
UPGRADER_LAUNCHER_VERSION = "1.5.0"


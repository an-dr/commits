# Named "upgrader" rather than "updater" on purpose: Windows' legacy
# installer-detection heuristic auto-requires elevation for any executable
# whose filename contains "update" (also "install"/"setup"/"patch"), which
# broke even running `cargo test` for this crate. Do not rename it back.
[package]
name = "commits-upgrader"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The launcher, the other half of the mechanism this crate implements: the
# app can only replace an entry point that something else built, so both
# halves ship from here rather than the launcher living in a host that would
# have to rewrite it. `launcher::run` is public for a host that would rather
# declare its own thin binary under its own name.
[[bin]]
name = "commits-launcher"
path = "src/bin/commits-launcher.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
commits-os = { path = "../os" }
dirs = "6.0.0"
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3.20"

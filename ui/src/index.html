<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>commits</title>
    <style>/*__COMMITS_CSS__*/</style>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div><div class="eyebrow">COMMITS · STANDALONE</div><h1>Repository history</h1></div>
        <form id="repository-form" class="repository-picker">
          <label class="sr-only" for="repository-path">Repository path</label>
          <input id="repository-path" placeholder="Choose or enter a repository folder" autocomplete="off">
          <button id="choose-repository" type="button" class="secondary">Choose…</button>
          <button type="submit">Open</button>
        </form>
      </header>
      <section class="toolbar" aria-label="Repository actions">
        <p id="status" class="status" role="status">Connecting to the core…</p>
        <button id="refresh" type="button" class="secondary">Refresh</button>
      </section>
      <section class="workspace" aria-label="Repository data">
        <aside class="branch-panel"><h2>References</h2><div id="branches" class="ref-list"><p class="empty">Open a repository to see its branches.</p></div></aside>
        <section class="history-panel"><div class="panel-heading"><h2>Commits</h2><span id="commit-count" class="count">0</span></div><ol id="commit-table" class="commit-table" aria-live="polite"></ol></section>
      </section>
      <section class="detail-panel"><div class="panel-heading"><h2>Commit detail</h2><label class="find"><span class="sr-only">Find commits</span><input id="find" placeholder="Find commits (Ctrl+F)"></label></div><div id="commit-detail" class="empty">Select a commit to inspect its local metadata.</div></section>
      <section id="errors" class="errors" hidden aria-live="assertive"></section>
    </main>
    <script>/*__COMMITS_JS__*/</script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>commits</title>
    <style>/*__COMMITS_CSS__*/</style>
  </head>
  <body>
    <main>
      <div class="eyebrow">PHASE 1 · WALKING SKELETON</div>
      <h1>commits</h1>
      <p id="status" class="status">Connecting to the core…</p>
      <form id="echo-form">
        <label for="echo-value">Round-trip a message through TypeScript → WASM → bones</label>
        <div class="row">
          <input id="echo-value" value="Hello from the web panel" autocomplete="off">
          <button type="submit">Send echo</button>
        </div>
      </form>
      <section aria-labelledby="native-title">
        <h2 id="native-title">Native capabilities</h2>
        <div class="row">
          <button type="button" data-os-action="clipboard-read">Read clipboard</button>
          <button type="button" data-os-action="pick-file">Pick file</button>
          <button type="button" data-os-action="pick-folder">Pick folder</button>
        </div>
        <p id="native-result" class="status">Ready for a native request.</p>
      </section>
      <ol id="history" aria-live="polite"></ol>
    </main>
    <script>/*__COMMITS_JS__*/</script>
  </body>
</html>
